spring.application.name=sales-backend

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/kookee_sales
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=replace_with_secure_secret_key_minimum_32_chars
jwt.access-token-expiration=1800
jwt.refresh-token-expiration=1209600

# Server Port
server.port=8080
